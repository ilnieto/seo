<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solución A2 · Keyword research paso a paso</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0b0e12;--panel:#11161d;--panel-2:#161d26;--line:#232b34;--ink:#ffffff;--muted:#f0f3f6;--accent:#4dd9c0;--accent-2:#f2a154;--good:#7cd992;--danger:#e2725b;}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:28px 16px 150px;font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center;margin:0 0 12px}
h1{text-align:center;font-family:"IBM Plex Mono",monospace;font-size:clamp(19px,4vw,27px);font-weight:600;margin:0 0 10px;text-wrap:balance}
.sub{text-align:center;color:var(--muted);font-size:14px;max-width:700px;margin:0 auto 24px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.lbl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin:0 0 9px}
.phases{display:flex;gap:18px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.phase{flex:0 0 auto;display:flex;flex-direction:column;gap:5px}
.phase-name{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);opacity:.7;white-space:nowrap}
.phase.on .phase-name{opacity:1;color:var(--accent);font-weight:600}
.dots{display:flex;gap:4px}
.dot{width:12px;height:12px;border-radius:50%;border:0;background:#2a333e;cursor:pointer;padding:0}
.dot.done{background:rgba(77,217,192,.45)}
.dot.on{background:var(--accent);box-shadow:0 0 0 3px rgba(77,217,192,.3)}
.grid{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:14px;margin-top:6px;align-items:start}
.right{display:grid;gap:14px;min-width:0}
.steppanel h2{font-size:21px;line-height:1.25;margin:4px 0 8px;color:var(--accent)}
.intro{font-size:14.5px;color:var(--muted);margin:0 0 14px}
.marks{display:flex;flex-direction:column;gap:7px}
.row{display:grid;grid-template-columns:24px 1fr;gap:3px 10px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);cursor:default}
.row:hover,.row:focus-visible{border-color:var(--cc);outline:none}
.row .n{width:22px;height:22px;border-radius:50%;background:var(--cc);color:#0b0e12;font:700 12px/22px "IBM Plex Mono",monospace;text-align:center}
.row .tag{font-weight:600;font-size:14px;align-self:center}
.row .why{grid-column:2;font-size:13.5px;color:var(--muted)}
.srcpanel{min-height:120px}
.srcpanel .lbl{color:var(--accent-2)}

/* elementos marcados (regla: badge numerado + contorno del color de su punto clave) */
[data-m="1"]{--cc:#4dd9c0}[data-m="2"]{--cc:#f2a154}[data-m="3"]{--cc:#a78bfa}
[data-m="4"]{--cc:#7cd992}[data-m="5"]{--cc:#e2725b}[data-m="6"]{--cc:#60a5fa}
[data-m]{position:relative;outline:2px solid var(--cc);outline-offset:3px;border-radius:6px}
[data-m]::after{content:attr(data-m);position:absolute;top:-9px;left:-9px;width:18px;height:18px;border-radius:50%;background:var(--cc);color:#0b0e12;font:700 11px/18px "IBM Plex Mono",monospace;text-align:center;z-index:3}
.hl{background:color-mix(in srgb,var(--cc) 16%,transparent)}

/* fuente: formulario, semillas, sugerencias */
.form{display:grid;gap:8px}
.f{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:grid;gap:2px}
.f span{font-family:"IBM Plex Mono",monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.seeds{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.seeds li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.seeds code{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink)}
.seeds span{font-size:13px;color:var(--muted)}
.seeds li.ok code{color:var(--good)}
.warn{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent-2);background:rgba(242,161,84,.1);border-radius:6px;font-size:13.5px}
.acq{border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:10px 12px;margin-bottom:9px}
.acq .q{font-size:13.5px;color:var(--muted);margin-bottom:6px}
.acq .q b{color:var(--ink);font-family:"IBM Plex Mono",monospace;font-weight:500}
.sug{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;padding:4px 6px;border-radius:5px;font-size:13.5px}
.sug .ico{width:14px;font-weight:700}
.sug.ok .ico{color:var(--good)}
.sug.no .ico{color:var(--danger)}
.sug.no .txt{color:var(--muted)}
.sug.sec .ico{color:var(--accent-2)}
.sug em{font-style:normal;font-size:12.5px;color:var(--muted);opacity:.9}
.tip{margin-top:10px;font-size:13.5px;padding:9px 11px;border-radius:6px;background:var(--panel-2);border:1px dashed var(--line)}
.block-title{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.quote{border-left:3px solid var(--accent);padding:8px 12px;background:var(--panel-2);border-radius:6px;margin-bottom:8px;font-size:13.5px}
.quote em{display:block;color:var(--ink);font-style:italic}
.quote span{color:var(--muted)}
.trends{padding:10px 12px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;font-size:13.5px;display:grid;gap:4px}
.qbox{padding:10px 12px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;margin-bottom:9px;display:grid;gap:3px}
.qbox b{font-size:14.5px}
.qbox span{font-size:13px;color:var(--muted)}
.ex{padding:10px 12px;border-left:3px solid var(--danger);background:rgba(226,114,91,.08);border-radius:6px;display:grid;gap:6px;font-size:13.5px}
.count{margin-top:10px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--accent)}
.formula{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.7;margin-top:10px}
.trap{margin-top:10px;padding:9px 11px;border-radius:6px;background:rgba(96,165,250,.1);font-size:13.5px}

/* tablas */
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-family:"IBM Plex Mono",monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.tablewrap{overflow:auto;max-width:100%;padding-top:10px}
tr.new td{background:rgba(124,217,146,.12)}
tr.new td:first-child{box-shadow:inset 3px 0 0 var(--good)}
tr.mod td{background:rgba(226,114,91,.12)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.met td,.met th,.ub td,.ub th{font-size:12.5px}
.ub .dim td{color:var(--muted)}
.dec{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600}
.dec.ok{background:rgba(124,217,146,.16);color:var(--good)}
.dec.no{background:rgba(226,114,91,.16);color:var(--danger)}
.pair{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);margin-bottom:10px}
.pair .ph{font-size:13.5px;color:var(--muted);margin-bottom:6px}
.pair .ph b{color:var(--ink);font-family:"IBM Plex Mono",monospace;font-weight:500}
.urls{margin:6px 0 0;padding-left:18px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);display:grid;gap:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.cl{border:1px solid var(--line);border-radius:8px;padding:11px;background:var(--panel-2);display:grid;gap:6px;font-size:13px}
.clname{font-weight:600;font-size:14px;color:var(--accent-2)}
.kv{color:var(--muted)}
.kv b{display:block;color:var(--ink);font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:12.5px;word-break:break-all}
.small{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.tile{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.tile b{display:block;font-size:24px;font-family:"IBM Plex Mono",monospace;color:var(--accent)}
.tile span{font-size:12.5px;color:var(--muted)}

/* nota, veredicto y barra */
.note{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted);text-align:center;min-height:36px;line-height:1.5;padding:0 10px;margin:18px 0 0}
.timeline{max-width:1180px;margin:18px auto 0;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.timeline-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .3s linear}
.verdict{text-align:center;margin:18px auto 0;max-width:760px;font-size:14px;color:var(--muted);line-height:1.6;min-height:28px;opacity:0;transition:opacity .4s}
.verdict.show{opacity:1}
.verdict b{color:var(--ink);font-weight:600}
.controls{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:calc(100% - 28px);max-width:1180px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;z-index:10}
.btns{display:flex;gap:6px;align-items:center}
.btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.play{background:var(--accent);border-color:var(--accent);color:#0b0e12}
.btn svg{width:16px;height:16px}
.counter{font-family:"IBM Plex Mono",monospace;font-size:13px;min-width:96px;text-align:center}
select.speed{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:0 8px}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
@media (max-width:560px){body{padding:18px 12px 190px}.controls{bottom:8px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
.sub{color:#fff !important}
.note,#noteBox{color:#fff !important;font-size:16px !important}
.verdict{color:#fff !important;font-size:16px !important}
.verdict b{color:#78d38f !important}
body{padding-bottom:140px !important}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Solución paso a paso · UP2 · A2 · DEMO</div>
  <h1>Keyword research de Café Alba, de la hoja vacía a los 5 clusters</h1>
  <p class="sub">27 keywords, 7 fuentes y un descarte documentado. En cada paso ves de dónde sale una keyword y por qué entra o queda fuera.</p>

  <div class="phases" id="phases" aria-label="Fases"></div>

  <div class="grid">
    <section class="panel steppanel">
      <div class="lbl" id="phaseName"></div>
      <h2 id="stepTitle"></h2>
      <p class="intro" id="stepIntro"></p>
      <span class="lbl">Puntos clave</span>
      <div class="marks" id="marks"></div>
    </section>
    <div class="right">
      <section class="panel srcpanel">
        <div class="lbl" id="srcLabel"></div>
        <div id="src"></div>
      </section>
      <section class="panel">
        <div class="lbl">Hoja Keywords · plantilla resuelta</div>
        <div class="tablewrap" id="sheet"></div>
      </section>
    </div>
  </div>

  <p class="note" id="noteBox"></p>
  <div class="timeline"><div class="timeline-fill" id="tfill"></div></div>
  <p class="verdict" id="verdict"></p>
</div>

<div class="controls">
  <div class="btns">
    <button class="btn" id="bRestart" title="Volver al principio (R)" aria-label="Volver al principio"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8a5 5 0 1 0 1.5-3.5M3 2v3h3"/></svg></button>
    <button class="btn" id="bPrev" title="Paso anterior (←)" aria-label="Paso anterior"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3 5 8l5 5"/></svg></button>
    <button class="btn play" id="bPlay" title="Reproducir (Espacio)" aria-label="Reproducir"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg></button>
    <button class="btn" id="bNext" title="Paso siguiente (→)" aria-label="Paso siguiente"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 3 5 5-5 5"/></svg></button>
    <span class="counter" id="counter" aria-live="polite"></span>
  </div>
  <div class="btns">
    <select class="speed" id="speed" aria-label="Velocidad">
      <option value="lenta">Lenta</option><option value="normal" selected>Normal</option><option value="rapida">Rápida</option>
    </select>
  </div>
</div>

const ADD = [[],[1,23],[3,9,11,14,15,19,20],[2,4,13,16,17,24],[8,25,7,22],[5,10,12,21],[6,18,26,27],[],[],[],[],[]];
const MC = ["#4dd9c0","#f2a154","#a78bfa","#7cd992","#e2725b","#60a5fa"];

function chip(t, st, m, why){

<!--PART3-->
<script>
const STEPS_A = [
{ ph:0, t:"La ficha del proyecto", label:"Hoja Proyecto",
  intro:"Antes de buscar nada, la hoja Proyecto fija el filtro: qué vende el cliente, a quién, en qué zona y con qué herramienta se miden las cifras.",
  marks:[

const PLAY_SVG = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg>';
const PAUSE_SVG = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg>';

// Estado de cada fila en la hoja según el paso
function estado(k, step){
  if (step >= 8) return k.U === "Descartar" ? "Descartar" : "P" + k.U;
  if (k.id === 14 && step >= 7) return "Descartada";
  return "Pendiente";
}
function cols(step){
  const c = [{h:"ID"},{h:"Keyword"}];
  if (step >= 9) c.push({h:"Cluster"},{h:"URL objetivo"});
  c.push({h:"Fuente"},{h:"Volumen"},{h:"KD"},{h:"Intención"});
  if (step >= 8) c.push({h:"D"},{h:"F"},{h:"Relevancia"},{h:"I"},{h:"Puntuación"},{h:"Prioridad"});
  else c.push({h:"Relevancia"},{h:"Estado"});
  return c;
}
function cellVal(k, h, step){
  switch(h){
    case "ID": return k.id;
    case "Keyword": return (k.rol === "Principal" ? "★ " : "") + k.kw;
    case "Cluster": return k.cl;
    case "URL objetivo": return k.url;
    case "Fuente": return k.fu;
    case "Volumen": return fmt(k.vol);
    case "KD": return k.kd;
    case "Intención": return k.int;
    case "Relevancia": return k.rel;
    case "D": return k.D;
    case "F": return k.F;
    case "I": return k.I;
    case "Puntuación": return String(k.T.toFixed(2)).replace(".", ",");
    case "Prioridad": return k.U === "Descartar" ? "Descartar" : "P" + k.U;
    case "Estado": return estado(k, step);
  }
  return "";
}
function renderSheet(step){
  const el = $("#sheet");
  const added = new Set();
  for (let i = 0; i <= step; i++) STEPS[i] && ADD[i].forEach(id => added.add(id));
  const fresh = new Set(ADD[step] || []);
  const sm = STEPS[step].sm || {};
  const headers = cols(step);
  const th = headers.map(c => {
    const m = sm[c.h] ? ` data-m="${sm[c.h]}"` : "";
    return `<th${m}>${c.h}</th>`;
  }).join("");
  const ids = [...added].sort((a,b) => a-b);
  if (!ids.length) {
    el.innerHTML = `<table><tr>${th}</tr></table><div class="empty">Hoja vacía: solo la cabecera.</div>`;
    return;
  }
  const rows = ids.map(id => {
    const k = K[id];
    const cls = fresh.has(id) ? "new" : (id === 14 && step === 7 ? "mod" : "");
    return `<tr class="${cls}">` + headers.map(c => `<td>${cellVal(k, c.h, step)}</td>`).join("") + `</tr>`;
  }).join("");
  el.innerHTML = `<table><tr>${th}</tr>${rows}</table>`;
}

function hl(n, on){
  document.querySelectorAll(`[data-m="${n}"]`).forEach(e => e.classList.toggle("hl", on));
}

function render(){
  const S = STEPS[cur];
  $("#phaseName").textContent = PHASES[S.ph] + " · paso " + (cur + 1);
  $("#stepTitle").textContent = S.t;
  $("#stepIntro").textContent = S.intro;
  $("#marks").innerHTML = S.marks.map((m, i) =>
    `<div class="row" tabindex="0" style="--cc:${MC[i]}" data-n="${i+1}"><span class="n">${i+1}</span><span class="tag">${m.tag}</span><span class="why">${m.why}</span></div>`
  ).join("");
  document.querySelectorAll("#marks .row").forEach(r => {
    const n = r.dataset.n;
    r.addEventListener("mouseenter", () => hl(n, true));
    r.addEventListener("mouseleave", () => hl(n, false));
    r.addEventListener("focus", () => hl(n, true));
    r.addEventListener("blur", () => hl(n, false));
  });
  $("#srcLabel").textContent = S.label;
  $("#src").innerHTML = S.src();
  renderSheet(cur);
  $("#noteBox").textContent = S.note;
  $("#verdict").classList.toggle("show", cur === STEPS.length - 1);
  $("#counter").textContent = `Paso ${cur + 1} / ${STEPS.length}`;
  $("#tfill").style.width = (cur / (STEPS.length - 1) * 100) + "%";
  document.querySelectorAll(".dot").forEach(d => {
    const i = +d.dataset.i;
    d.className = "dot" + (i === cur ? " on" : i < cur ? " done" : "");
  });
  document.querySelectorAll(".phase").forEach(p => p.classList.toggle("on", +p.dataset.p === S.ph));
}

function go(i){
  cur = Math.max(0, Math.min(STEPS.length - 1, i));
  render();
}

function play(on){
  playing = on;
  $("#bPlay").innerHTML = on ? PAUSE_SVG : PLAY_SVG;
  $("#bPlay").setAttribute("aria-label", on ? "Pausar" : "Reproducir");
  clearInterval(timer);
  if (on) {
    timer = setInterval(() => {
      if (cur >= STEPS.length - 1) { play(false); return; }
      go(cur + 1);
    }, DELAY[$("#speed").value]);
  }
}

function buildPhases(){
  const track = $("#phases");
  PHASES.forEach((name, p) => {
    const div = document.createElement("div");
    div.className = "phase";
    div.dataset.p = p;
    div.innerHTML = `<span class="phase-name">${name}</span><span class="dots"></span>`;
    const dots = div.querySelector(".dots");
    STEPS.forEach((s, i) => {
      if (s.ph !== p) return;
      const b = document.createElement("button");
      b.className = "dot";
      b.dataset.i = i;
      b.title = s.t;
      b.setAttribute("aria-label", s.t);
      b.addEventListener("click", () => { play(false); go(i); });
      dots.appendChild(b);
    });
    track.appendChild(div);
  });
}

buildPhases();
$("#bNext").addEventListener("click", () => go(cur + 1));
$("#bPrev").addEventListener("click", () => go(cur - 1));
$("#bRestart").addEventListener("click", () => { play(false); go(0); });
$("#bPlay").addEventListener("click", () => play(!playing));
$("#speed").addEventListener("change", () => { if (playing) play(true); });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === "ArrowRight") go(cur + 1);
  else if (e.key === "ArrowLeft") go(cur - 1);
  else if (e.key === " ") { e.preventDefault(); play(!playing); }
  else if (e.key === "r" || e.key === "R") { play(false); go(0); }
});
$("#verdict").innerHTML = "Lo que se evalúa es <b>el criterio</b>: qué entra, qué se descarta y por qué. Las cifras son ilustrativas; en tu práctica deben salir de la herramienta indicada y con fecha de consulta.";
render();
</script>
</body>
</html>
